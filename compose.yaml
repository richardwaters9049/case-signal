name: casesignal

services:
  frontend:
    image: oven/bun:1.3.14
    working_dir: /app
    command: >-
      sh -c "bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    command: >-
      sh -c "composer install --no-interaction --prefer-dist && php -d variables_order=EGPCS -S 0.0.0.0:8000 -t public"
    environment:
      APP_ENV: dev
      APP_SECRET: casesignal-development-only-secret
      DATABASE_URL: postgresql://casesignal:casesignal@database:5432/casesignal?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casesignal
      POSTGRES_USER: casesignal
      POSTGRES_PASSWORD: casesignal
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casesignal -d casesignal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend_vendor:
  database_data:
  frontend_next:
  frontend_node_modules:
  redis_data:
